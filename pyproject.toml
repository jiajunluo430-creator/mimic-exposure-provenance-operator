[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medprov"
version = "0.1.0"
description = "Machine-executable provenance operators for medication-exposure phenotyping"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Jiajun Luo"},
  {name = "Qinglong Chen"},
  {name = "Jing Liu"},
  {name = "Fanghui Lu"},
  {name = "Xiaolong Liang"}
]
keywords = ["electronic health records", "medication exposure", "provenance", "phenotyping", "MIMIC-IV"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.20,<5",
  "duckdb>=1.4,<2"
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "coverage>=7,<8",
  "build>=1.2,<2"
]
dev = [
  "ruff>=0.12,<1",
  "mypy>=1.15,<2",
  "types-PyYAML>=6.0,<7"
]

[project.scripts]
medprov = "medprov.cli:main"

[project.urls]
Repository = "https://github.com/jiajunluo430-creator/mimic-exposure-provenance-operator"
Issues = "https://github.com/jiajunluo430-creator/mimic-exposure-provenance-operator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/medprov/schemas" = ["schemas/*.json"]
"share/medprov/examples" = ["examples/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["medprov"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
