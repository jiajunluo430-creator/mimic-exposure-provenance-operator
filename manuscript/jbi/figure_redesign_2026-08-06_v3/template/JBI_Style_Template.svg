    <g id="panel_A_labels">
      <text id="panel_A_panel_title_002" x="42" y="24" fill="#1B2733" font-family="Arial" font-size="14.5px" font-weight="700" text-anchor="start">JBI data-first figure template</text>
      <text id="panel_A_panel_subtitle_003" x="42" y="43" fill="#607180" font-family="Arial" font-size="9.5px" font-weight="400" text-anchor="start">Reusable visual grammar for architecture, capability, and quantitative evidence</text>
      <text id="panel_A_process_title_005" x="24" y="86" fill="#28557D" font-family="Arial" font-size="9.2px" font-weight="700" text-anchor="start">1  PROCESS SPINE</text>
      <text id="panel_A_template_node_0_label_008" x="55" y="158" fill="#1B2733" font-family="Arial" font-size="8.6px" font-weight="400" text-anchor="middle">native source</text>
      <text id="panel_A_template_node_1_label_010" x="175" y="158" fill="#1B2733" font-family="Arial" font-size="8.6px" font-weight="400" text-anchor="middle">adapter</text>
      <text id="panel_A_template_node_2_label_012" x="310" y="158" fill="#1B2733" font-family="Arial" font-size="8.6px" font-weight="400" text-anchor="middle">canonical event</text>
      <text id="panel_A_template_node_3_label_014" x="455" y="158" fill="#1B2733" font-family="Arial" font-size="8.6px" font-weight="400" text-anchor="middle">four-state output</text>
      <text id="panel_A_status_title_016" x="535" y="86" fill="#28557D" font-family="Arial" font-size="9.2px" font-weight="700" text-anchor="start">2  STATUS GLYPHS</text>
      <text id="panel_A_template_status_0_label_018" x="575" y="126" fill="#17212B" font-family="Arial" font-size="8.8px" font-weight="400" text-anchor="start">supported</text>
      <text id="panel_A_template_status_1_label_021" x="575" y="168" fill="#17212B" font-family="Arial" font-size="8.8px" font-weight="400" text-anchor="start">partial / relocated</text>
      <text id="panel_A_template_status_2_label_024" x="575" y="210" fill="#17212B" font-family="Arial" font-size="8.8px" font-weight="400" text-anchor="start">unavailable</text>
      <text id="panel_A_quant_title_027" x="24" y="310" fill="#28557D" font-family="Arial" font-size="9.2px" font-weight="700" text-anchor="start">3  QUANTITATIVE MARKS</text>
      <text id="panel_A_lollipop_label_031" x="24" y="359" fill="#17212B" font-family="Arial" font-size="8.8px" font-weight="400" text-anchor="start">directly labeled estimate</text>
      <text id="panel_A_ci_label_037" x="24" y="412" fill="#17212B" font-family="Arial" font-size="8.8px" font-weight="400" text-anchor="start">effect with interval</text>
      <text id="panel_A_type_title_039" x="535" y="310" fill="#28557D" font-family="Arial" font-size="9.2px" font-weight="700" text-anchor="start">4  TYPOGRAPHY + PALETTE</text>
      <text id="panel_A_type_1_040" x="555" y="347" fill="#17212B" font-family="Arial" font-size="9px" font-weight="700" text-anchor="start">Arial / Helvetica · live text</text>
      <text id="panel_A_type_2_041" x="555" y="369" fill="#607180" font-family="Arial" font-size="8.6px" font-weight="400" text-anchor="start">14.5 pt panel title · 8–10 pt labels</text>
      <text id="panel_A_type_3_042" x="555" y="391" fill="#607180" font-family="Arial" font-size="8.6px" font-weight="400" text-anchor="start">0.8–1.2 pt rules · square corners</text>
    </g>
    <g id="panel_A_legend">
      <rect id="panel_A_swatch_0_043" x="555" y="423" width="14" height="14" fill="#3F78A8" stroke="#3F78A8" stroke-width="1" />
      <text id="panel_A_swatch_0_label_044" x="576" y="435" fill="#17212B" font-family="Arial" font-size="8.3px" font-weight="400" text-anchor="start">source</text>
      <rect id="panel_A_swatch_1_045" x="705" y="423" width="14" height="14" fill="#249A8D" stroke="#249A8D" stroke-width="1" />
      <text id="panel_A_swatch_1_label_046" x="726" y="435" fill="#17212B" font-family="Arial" font-size="8.3px" font-weight="400" text-anchor="start">delivered</text>
      <rect id="panel_A_swatch_2_047" x="555" y="458" width="14" height="14" fill="#E58A28" stroke="#E58A28" stroke-width="1" />
      <text id="panel_A_swatch_2_label_048" x="576" y="470" fill="#17212B" font-family="Arial" font-size="8.3px" font-weight="400" text-anchor="start">unresolved</text>
      <rect id="panel_A_swatch_3_049" x="705" y="458" width="14" height="14" fill="#6D7881" stroke="#6D7881" stroke-width="1" />
      <text id="panel_A_swatch_3_label_050" x="726" y="470" fill="#17212B" font-family="Arial" font-size="8.3px" font-weight="400" text-anchor="start">unavailable</text>
    </g>
    <g id="panel_A_annotations">
      <text id="panel_A_panel_tag_001" x="14" y="24" fill="#1B2733" font-family="Arial" font-size="17px" font-weight="700" text-anchor="start">A</text>
      <text id="panel_A_process_note_015" x="255" y="184" fill="#607180" font-family="Arial" font-size="8.5px" font-weight="400" text-anchor="middle">Use lanes, rules, and labeled edges; avoid decorative containers.</text>
      <text id="panel_A_status_note_025" x="555" y="246" fill="#607180" font-family="Arial" font-size="8.3px" font-weight="400" text-anchor="start">Shape + color preserves meaning in grayscale and for color-vision differences.</text>
      <text id="panel_A_lollipop_value_032" x="402" y="359" fill="#249A8D" font-family="Arial" font-size="8.8px" font-weight="700" text-anchor="start">70.0%</text>
      <text id="panel_A_ci_value_038" x="442" y="412" fill="#607180" font-family="Arial" font-size="8.5px" font-weight="400" text-anchor="start">1.64 (1.51–1.79)</text>
      <text id="panel_A_template_boundary_051" x="450" y="503" fill="#607180" font-family="Arial" font-size="8.7px" font-weight="400" text-anchor="middle">White background · no gradients · no shadows · no rounded-card dashboard composition</text>
    </g>
