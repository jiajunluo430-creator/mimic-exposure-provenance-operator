      <line id="panel_A_template_status_2_x1_022" x1="550" y1="201" x2="560" y2="211" stroke="#6D7881" stroke-width="1.7" stroke-linecap="round" />
      <line id="panel_A_template_status_2_x2_023" x1="550" y1="211" x2="560" y2="201" stroke="#6D7881" stroke-width="1.7" stroke-linecap="round" />
