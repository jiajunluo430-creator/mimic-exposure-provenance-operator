      <circle id="panel_A_lollipop_point_030" cx="390" cy="355" r="5.5" fill="#249A8D" stroke="#FFFFFF" stroke-width="1" />
      <line id="panel_A_ci_line_033" x1="260" y1="408" x2="430" y2="408" stroke="#3F78A8" stroke-width="1.5" stroke-linecap="round" />
      <line id="panel_A_ci_low_034" x1="260" y1="403" x2="260" y2="413" stroke="#3F78A8" stroke-width="1" stroke-linecap="round" />
      <line id="panel_A_ci_high_035" x1="430" y1="403" x2="430" y2="413" stroke="#3F78A8" stroke-width="1" stroke-linecap="round" />
      <circle id="panel_A_ci_point_036" cx="348" cy="408" r="5" fill="#3F78A8" stroke="#FFFFFF" stroke-width="1" />
