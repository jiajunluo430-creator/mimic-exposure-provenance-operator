<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="JBI Style Template">
  <g id="panel_A">
    <g id="panel_A_axis">
